name: Feature request
description: Suggest something InterviewAI should do that it does not do yet.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue, in your own words. The why matters as much as the what: it decides what gets built first.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should InterviewAI do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: What moment in a call or in prep would it make better?
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: How you picture it working
      description: Optional. A button, a setting, a shortcut: whatever you had in mind.
    validations:
      required: false
